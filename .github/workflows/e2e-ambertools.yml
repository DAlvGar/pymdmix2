name: Full Test Suite (Docker / AmberTools)

# Runs the complete pytest suite inside the project's Docker image.
# The image ships AmberTools (tleap + cpptraj), so every test tier runs:
#   - standard tests    (no marker)  – always run
#   - ambertools tests  (@ambertools) – tleap / LEaP available in image
#   - cpptraj tests     (@cpptraj)   – cpptraj ships with AmberTools
#   - real_data tests   (@real_data) – skipped unless tests/data/ LFS files
#                                      are present (see step 3 below)
#
# Triggers:
#   - Push / merge to main
#   - Manual dispatch (Actions → "Run workflow")
#   - Weekly schedule (keeps the image cache warm and catches upstream regressions)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday

jobs:
  full-suite-docker:
    name: Full test suite (Docker with AmberTools)
    runs-on: ubuntu-latest
    timeout-minutes: 90 # conda build + tests can take a while on a cold cache
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout (with LFS so real_data tests can run too)
      # -----------------------------------------------------------------------
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # -----------------------------------------------------------------------
      # 2. Set up Docker Buildx (required for cache export)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 3. Build the Docker image (with GitHub Actions layer cache)
      #    First build: ~30–50 min (conda install ambertools is large)
      #    Cached builds: ~3–5 min
      # -----------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pymdmix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 4. Run the FULL test suite inside the container.
      #    No -m filter — all tiers run.  AmberTools (tleap + cpptraj) is
      #    available in the image so ambertools/cpptraj tests are NOT skipped.
      #    real_data tests run because we checked out LFS files in step 1.
      # -----------------------------------------------------------------------
      - name: Run full test suite
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          docker run --rm \
            --name pymdmix_ci \
            -v "${{ github.workspace }}/tests:/opt/pymdmix/tests" \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            --entrypoint pytest \
            pymdmix:ci \
            --tb=short \
            -v \
            --junitxml=/artifacts/report.xml \
            /opt/pymdmix/tests/

      # -----------------------------------------------------------------------
      # 5. Upload test reports as an artifact for debugging
      # -----------------------------------------------------------------------
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            ${{ github.workspace }}/artifacts/
          retention-days: 7
